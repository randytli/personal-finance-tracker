  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: supabase
      POSTGRES_PASSWORD: supabase
      POSTGRES_DB: pft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase"]
      interval: 10s
      retries: 5
      start_period: 5s

  db-production-pilot:
    image: postgres:16
    profiles: ["production-pilot"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PFT_PILOT_DB_USER:?Set PFT_PILOT_DB_USER}
      POSTGRES_PASSWORD: ${PFT_PILOT_DB_PASSWORD:?Set PFT_PILOT_DB_PASSWORD}
      POSTGRES_DB: ${PFT_PILOT_DB_NAME:-pft_production_pilot}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_production_pilot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 5s

  db-production-backfill:
    image: postgres:16
    profiles: ["production-backfill"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PFT_BACKFILL_DB_USER:?Set PFT_BACKFILL_DB_USER}
      POSTGRES_PASSWORD: ${PFT_BACKFILL_DB_PASSWORD:?Set PFT_BACKFILL_DB_PASSWORD}
      POSTGRES_DB: ${PFT_BACKFILL_DB_NAME:-pft_production_backfill}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_production_backfill:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 5s
volumes:
  pgdata:
  pgdata_production_pilot:
  pgdata_production_backfill:
