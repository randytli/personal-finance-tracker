# PFT independent backup workflow: TEMPLATE for the dedicated private backup
# repository (owner decisions P1-1 / P1-2, 2026-10-02).
#
# It is deliberately NOT under .github/workflows in the PFT repository, so it
# never runs there. Installation is in README.md next to this file.
#
# Scope (owner-approved exception to plan §12.4 "one scheduler"):
# - read-only export, no advisory locks, no financial writes;
# - no Plaid call, no Fernet key, no decryption key;
# - writes only releases in this repository.
name: pft-backup

on:
  # Manual only until the first restore is accepted (owner, 2026-10-02).
  # Daily schedule (P1-5) to add afterwards, as a separately reviewed change:
  #   schedule:
  #     - cron: "23 8 * * *"   # off the top of the hour (GitHub load guidance)
  # Manual point before every migration, cutover or schema change (P1-5).
  workflow_dispatch: {}

permissions:
  contents: write   # create, publish and delete releases in this repository only

concurrency:
  group: pft-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGE_VERSION: v1.3.2
      # SHA-256 digest published on the official release page for
      # age-v1.3.2-linux-amd64.tar.gz (looked up and re-computed 2026-10-02).
      AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      # PostgreSQL 17 client matching the Supabase 17.x server, pinned by digest
      # (recorded in docs/PFT_M5_CLOUD_COMPATIBILITY_2026-10-01.md).
      PG_IMAGE: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      PGHOST: ${{ vars.PFT_BACKUP_PGHOST }}         # session pooler host
      PGPORT: ${{ vars.PFT_BACKUP_PGPORT }}         # 5432 (session mode)
      PGUSER: ${{ vars.PFT_BACKUP_PGUSER }}         # read-only pft_backup role
      PGDATABASE: ${{ vars.PFT_BACKUP_PGDATABASE }} # also the expected database name
      PFT_BACKUP_SCHEMAS: ${{ vars.PFT_BACKUP_SCHEMAS }}
      PGSSLMODE: verify-full
      PGCONNECT_TIMEOUT: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install age (pinned version, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o age.tgz \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  age.tgz" | sha256sum -c -
          tar xzf age.tgz
          "$RUNNER_TEMP/age/age" --version
          echo "PFT_AGE_BIN=$RUNNER_TEMP/age/age" >> "$GITHUB_ENV"

      - name: Pull pinned PostgreSQL client image
        run: docker pull "$PG_IMAGE"

      - name: Dump in one snapshot, encrypt to all recipients, upload with readback, prune
        env:
          PGPASSWORD: ${{ secrets.PFT_BACKUP_PGPASSWORD }}
          PGSSLROOTCERT: ${{ github.workspace }}/config/supabase-ca.crt
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c runner/SHA256SUMS
          # Schemas to back up, space separated (repository variable
          # PFT_BACKUP_SCHEMAS). Synthetic M5 project:
          # "pft_m5_bench_2610 pft_m5_bench_35600 pft_m5_probe public".
          # The runner fails closed while any non-provider schema is unselected.
          schema_args=()
          for schema in ${PFT_BACKUP_SCHEMAS:?set the PFT_BACKUP_SCHEMAS variable}; do
            schema_args+=(--schema "$schema")
          done
          python3 runner/pft_backup_runner.py \
            --store "github:${GITHUB_REPOSITORY}" \
            --recipients config/recipients.txt \
            --expected-database "$PGDATABASE" \
            "${schema_args[@]}" \
            --work-dir "$RUNNER_TEMP" \
            --pg-wrapper "docker run --rm -i --network host --user $(id -u):$(id -g) \
              -v $RUNNER_TEMP:$RUNNER_TEMP -v $GITHUB_WORKSPACE/config:$GITHUB_WORKSPACE/config:ro \
              -w $RUNNER_TEMP -e HOME=$RUNNER_TEMP \
              -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE -e PGSSLROOTCERT \
              -e PGCONNECT_TIMEOUT -e PFT_WORK -e PFT_DUMP_SCHEMA_ARGS $PG_IMAGE"
